name: first CI/CD pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Job 1: everything related to the app code itself
  build-app:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: install dep
        run: npm install

      - name: lint
        run: npm run lint

      - name: build
        run: npm run build

      - name: upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist/

  # Job 2: dockerize and push - only runs if build-app succeeds
  docker-build-push:
    needs: build-app
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4 # needed again - fresh runner, no files yet

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: login to docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:latest
